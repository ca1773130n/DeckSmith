    <meta name="viewport" content="width=device-width, initial-scale=1" />

{
  "slides": [
    {
      "sceneId": "s1",
      "startTime": 0,
      "endTime": 6,
      "notes": "This paper puts a thought process that stays small up against a task whose output has to stay large — every pixel of it.",
      "fragments": [
        1.9
      ]
    },
    {
      "sceneId": "s2",
      "startTime": 6,
      "endTime": 16,
      "notes": "Two earlier answers exist, and each gives something up. CTM carries a compact thought state with no spatial field at all, and the window-wise adaptation pools every window down to one summary token, which throws position away. This work keeps one query per position, so the field survives every tick.",
      "fragments": [
        7.45,
        8.35,
        9.25,
        10.2
      ]
    },
    {
      "sceneId": "s3",
      "startTime": 16,
      "endTime": 25,
      "notes": "The encoder does the heavy lifting first, in the style SwinIR established. Then the field is cut into windows, and nothing is pooled away on the way through. The thought machine sits here in the middle, working on what the windows hold. Only at the very end does the decoder upsample, four times over. That loop is a single tick, and it runs in place rather than around the whole pipeline. Every tick reuses the same weights, so thinking for longer costs time and not memory.",
      "fragments": [
        17.55,
        18.95,
        20.35,
        21.75,
        23,
        23.75
      ]
    },
    {
      "sceneId": "s4",
      "startTime": 25,
      "endTime": 34,
      "notes": "The three approaches sit side by side here, and they differ only in what they hand the thought block. The windows come first: the field is partitioned, and each one is handled on its own. The block in the middle is shared, the same weights for every window. And what comes out is still a dense field, one query for every position in it.",
      "fragments": [
        26.55,
        27.8,
        28.75,
        29.7
      ]
    },
    {
      "sceneId": "s5",
      "startTime": 34,
      "endTime": 43,
      "notes": "Picture the feature map as a grid of tokens. Attention runs inside one window at a time. The next window does the same, and at this stage the two never mix. Count the tokens before a tick and after it and you get the same number.",
      "fragments": [
        35.6,
        36.65,
        37.85,
        38.85
      ]
    },
    {
      "sceneId": "s6",
      "startTime": 43,
      "endTime": 52,
      "notes": "The encoder turns the low-resolution image into a dense feature field. The partition then cuts that field into windows without throwing any of it away.",
      "fragments": [
        45.4,
        47.3
      ]
    },
    {
      "sceneId": "s7",
      "startTime": 52,
      "endTime": 61,
      "notes": "Take the carrier out of the first line and put it where F stands in the second. The encoder's output slides inside the window read, and the two statements become one composition.",
      "fragments": [
        53.8,
        58.05
      ]
    },
    {
      "sceneId": "s8",
      "startTime": 61,
      "endTime": 70,
      "notes": "At the bottom is the carrier, and it keeps every token it started with. Above it sit the queries — one for each position, rather than one for each window. Synchronisation is the part that remembers: every neuron carries its own history. The compact state on top is what actually changes from one tick to the next.",
      "fragments": [
        62.52,
        63.32,
        64.12,
        64.92
      ]
    },
    {
      "sceneId": "s9",
      "startTime": 70,
      "endTime": 79,
      "notes": "This is the authors' own drawing of one tick, and the two rows are the two halves of it. The compact state runs along the top and ends in a dense query projection; underneath, the carrier is read as dense keys and values and comes back updated, added to what arrived.",
      "fragments": [
        71.4,
        72.4
      ]
    },
    {
      "sceneId": "s10",
      "startTime": 79,
      "endTime": 88,
      "notes": "On parameters the method is the second largest here, at 1.13 million. So this is not the cheap option, and the paper never claims it is.",
      "fragments": [
        82.65,
        83.45
      ]
    },
    {
      "sceneId": "s11",
      "startTime": 88,
      "endTime": 97,
      "notes": "These are five-benchmark averages at four times upscaling. CATANet is the one to beat, at 29.48. The method here comes in at 28.98 — ahead of two CNN baselines, behind the transformer. Only that last row was trained for this paper. Every other number is quoted.",
      "fragments": [
        90.35,
        91.05,
        92.25,
        93.55
      ]
    },
    {
      "sceneId": "s12",
      "startTime": 97,
      "endTime": 106,
      "notes": "The first tick is worth almost a full decibel. The fourth is worth under a tenth, and training stopped there, so nothing past it is demonstrated.",
      "fragments": [
        100,
        100.8
      ]
    },
    {
      "sceneId": "s13",
      "startTime": 106,
      "endTime": 115,
      "notes": "On the left each column is one more tick, and in the top two rows the detail keeps arriving. On the right is what is still wrong, on the same three crops — and the bottom row stays bright at every tick.",
      "fragments": [
        107.95,
        108.85,
        109.65
      ]
    },
    {
      "sceneId": "s14",
      "startTime": 115,
      "endTime": 125,
      "notes": "The honest ceiling, before the takeaway. CATANet averages 29.482 against this method's 28.983, and each extra tick buys less than the one before it until the curve flattens after about four. The paper's own numbers disagree too: the abstract reports 28.10 to 30.28 where its table says 28.91 to 30.47.",
      "fragments": [
        116.45,
        117.35,
        118.25,
        119.2
      ]
    },
    {
      "sceneId": "s15",
      "startTime": 125,
      "endTime": 134,
      "notes": "What to take away. A dense carrier held across every tick, read by a compact thought process, is enough to match CNN baselines at a comparable parameter count.",
      "fragments": [
        126.4,
        127.4
      ]
    }
  ],

.ds-chrome{position:fixed;inset:auto 0 0 0;z-index:2147483000;pointer-events:none;
  font:500 13px/1.5 ui-sans-serif,system-ui,sans-serif;color:#fff}
.ds-bar{height:3px;background:rgba(255,255,255,.14)}
.ds-bar>i{display:block;height:100%;background:currentColor;transform-origin:0 50%;
  transform:scaleX(0);transition:transform .18s ease-out}
.ds-count{position:absolute;right:14px;bottom:10px;opacity:.45;font-variant-numeric:tabular-nums}
/* The only control the deck offers by pointer. Bottom-right beside the counter,
   because that is where a viewer already looks to know where they are. */
.ds-play{position:absolute;right:70px;bottom:6px;width:26px;height:26px;padding:0;
  border:0;border-radius:50%;background:rgba(255,255,255,.10);color:#fff;cursor:pointer;
  pointer-events:auto;opacity:.55;transition:opacity .15s,background-color .15s;
  display:grid;place-items:center;font:inherit;line-height:1}
.ds-play:hover{opacity:1;background:rgba(255,255,255,.2)}
.ds-play::before{content:"";display:block;width:0;height:0;margin-left:2px;
  border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.ds-play[data-on="1"]::before{margin-left:0;width:8px;height:10px;border:0;
  background:linear-gradient(to right,currentColor 0 3px,transparent 3px 5px,currentColor 5px 8px)}
/* THE PLAYER-PAGE VIDEO, and everything it needs lives INSIDE .ds-chrome. That
   buys two things without writing them twice: the click-to-advance handler
   already skips anything the chrome contains, and pointer-events are already off
   everywhere the overlay is not.

   A LIGHTBOX RATHER THAN AN OVERLAY ALIGNED TO THE POSTER, deliberately. The
   poster is an image inside the player's iframe, drawn at 1920x1080 and scaled
   to the viewport by the player; putting a rectangle exactly over it means the
   iframe's own rect times the player's scale, recomputed on resize, on
   fullscreen (the "f" key), and again whenever .ds-cap shrinks the player to
   make room for subtitles. That arithmetic is right at one window size and
   silently wrong at every other, and no gate here opens deck.html to notice. The
   lightbox is the same size wherever the poster is. */
.ds-video{position:absolute;right:106px;bottom:6px;height:26px;padding:0 12px;border:0;
  border-radius:13px;background:rgba(255,255,255,.10);color:#fff;cursor:pointer;
  pointer-events:auto;opacity:.55;font:inherit;line-height:26px;
  transition:opacity .15s,background-color .15s}
.ds-video:hover{opacity:1;background:rgba(255,255,255,.2)}
.ds-video[hidden]{display:none}
.ds-film{position:fixed;inset:0;display:grid;place-items:center;
  background:rgba(0,0,0,.88);pointer-events:auto}
.ds-film iframe{width:min(92vw,158vh);aspect-ratio:16/9;border:0;background:#000}
.ds-shut{position:absolute;top:16px;right:16px;width:34px;height:34px;padding:0;border:0;
  border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;
  font:inherit;line-height:34px}
.ds-notes{position:absolute;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;
  padding:20px 24px;background:rgba(10,10,10,.92);font-size:19px;line-height:1.6;
  white-space:pre-wrap;pointer-events:auto}
.ds-notes[hidden]{display:none}
.ds-flags{position:absolute;left:14px;bottom:10px;opacity:.5;letter-spacing:.02em}

/* The subtitle lives BELOW the slide, in a strip the player is shrunk to make
   room for. Overlaying it was tried and does not work: the slide is 1920x1080
   of composition the archetypes already fill, and a two-line band is ~160 of
   those pixels. Overlaid, it ran through the bottom note of grid, stack,
   split-compare and bar-compare. Reserving the space inside the composition
   instead \u2014 growing the scene's bottom padding \u2014 moved the collision rather
   than removing it: scene content is vertically CENTRED, so the six tallest
   archetypes simply overflowed upward and pushed their eyebrows off the top of
   the frame, by 79px on bar-compare. Both gates passed both times.

   Out here there is nothing to collide with, no scrim is needed because the
   strip is page background rather than slide, and no archetype has to know that
   narration exists. The slide gets smaller; nothing gets covered.

   The strip is reserved for the whole session, not per cue, so the slide does
   not resize every time someone stops talking. Two lines is its budget, which
   splitCue in ./subtitles.ts guarantees by capping cue length.

   "pretty", never "balance": balance evens line lengths by SHRINKING the box,
   which turned an 81-character cue into three short lines inside a box half the
   width it was given. The band must fill the width it has before taking another
   line, or the two-line budget is a fiction. */
.ds-cap{--ds-cap-font:clamp(22px,2.2vw,38px)}
.ds-cap hyperframes-player{height:calc(100vh - var(--ds-cap-h))}
.ds-cap{--ds-cap-h:calc(var(--ds-cap-font) * 3.5)}
.ds-subs{position:absolute;left:0;right:0;bottom:0;height:var(--ds-cap-h,0px);
  display:flex;align-items:center;justify-content:center;padding:0 5vw;
  text-align:center;color:#fff;font-weight:600;font-size:var(--ds-cap-font);
  line-height:1.35;text-wrap:pretty}
.ds-subs[hidden]{visibility:hidden}
