name: release

# Tag-driven, so publishing is a deliberate act with a name on it rather than a
# side effect of merging. `v0.2.0` publishes whatever `package.json` says it is;
# the guards below refuse the ways that go wrong quietly.
#
# NO TOKEN. Authentication is OIDC — npm trusted publishing — so there is no
# long-lived credential in this repository to leak, rotate or forget. npm mints a
# short-lived one for this workflow, on this repository, at publish time.
#
# THIS FILE'S NAME IS PART OF THE CREDENTIAL. The trusted publisher on npmjs.com
# names the workflow file exactly, `release.yml`, and npm does not verify that
# configuration when it is saved. Renaming this file breaks publishing, and it
# breaks it as an authentication error that says nothing about a rename.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm reads the OIDC token this grants. Without it: ENEEDAUTH.

jobs:
  publish:
    runs-on: ubuntu-latest # OIDC is not supported on self-hosted runners.
    timeout-minutes: 20
    # PART OF THE CREDENTIAL, exactly like the filename above. The OIDC token
    # carries this name as a claim, and the trusted publisher on npmjs.com is
    # configured to require it — so a workflow in this repository that is not
    # this job cannot publish, even one added later with `id-token: write`.
    # Change it here and it must change there in the same breath.
    #
    # It is also where deployment protection lives: the environment is
    # restricted to `v*` TAGS, so a push to a branch cannot reach it. Required
    # reviewers belong here too and are not set — GitHub gates that rule behind
    # a paid plan for private repositories.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No cache. A release is the one build that must not be handed
          # anything an earlier run left behind, which is npm's own guidance for
          # release workflows; the cache is worth seconds against that.
          package-manager-cache: false

      # Node 22 ships npm 10, and OIDC publishing landed in npm 11.5.1. Without
      # this the run fails at the last step with an authentication error that
      # reads like a misconfigured trusted publisher rather than an old CLI.
      - name: npm new enough to authenticate with OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      # THE SAME GATES `main` IS MERGED ON. A release that skips them is a
      # release nobody checked: `ci.yml` runs on the branch, and a tag can point
      # at any commit, including one that never saw a pull request.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The tag and the manifest have to agree. They drift the moment someone
      # tags before bumping, and npm will happily publish the OLD version under
      # the NEW tag's name, which is unrecoverable — a version number is spent
      # the first time it is used.
      - name: The tag is the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      # Fails here rather than at `npm publish`, where a missing OIDC token
      # surfaces as ENEEDAUTH and reads like a registry problem. GitHub sets
      # this only when `id-token: write` is in force.
      - name: There is an OIDC token to authenticate with
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "no OIDC token: this job was given no id-token:write permission." >&2
            exit 1
          fi

      # NO `--provenance`, and none is needed: trusted publishing generates
      # provenance by itself when the publish is OIDC, the package is public and
      # THE REPOSITORY is public. All three now hold — the repo is public — so
      # the next release should carry an attestation without changing anything
      # here.
      #
      # None of 0.1.0 through 0.1.3 has one. All four were published inside a
      # hundred minutes on 2026-08-01, while the repository was still private,
      # and provenance is not supported from a private source however public the
      # package is. So an empty attestation list on those four is the old state
      # showing, not this workflow failing. If 0.1.4 also lands without one,
      # that IS this workflow failing, and it is worth stopping to find out why.
      #
      # `--access public` because a scoped package is private by default.
      - run: npm publish --access public
