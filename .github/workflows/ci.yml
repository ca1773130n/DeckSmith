name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR run tells us nothing; let the newest push win.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # No render step. Rendering needs Chromium and ffmpeg and costs minutes per
      # deck; the gates that catch renderer mistakes live in `decksmith verify`
      # and run against a built deck, not against every push.
