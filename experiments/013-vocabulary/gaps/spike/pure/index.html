<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>013 — vector technique seek purity</title>
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/MorphSVGPlugin.min.js"></script>
    <script src="vendor/MotionPathPlugin.min.js"></script>
    <script src="vendor/DrawSVGPlugin.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      body { font-family: system-ui, sans-serif; color: #e8eaed; }
      #root { position: absolute; inset: 0; }
      .cell { position: absolute; width: 480px; height: 360px; overflow: hidden;
              border-right: 1px solid #1d222a; border-bottom: 1px solid #1d222a; }
      .cell .lab { position: absolute; left: 12px; top: 8px; font-size: 22px;
                   letter-spacing: .06em; color: #7f8b99; font-weight: 600; z-index: 5; }
      svg { position: absolute; inset: 0; width: 480px; height: 360px; }
      .ink { fill: none; stroke: #6ee7ff; stroke-width: 10; }
      .solid { fill: #ffd166; }

      /* c09: pure CSS @keyframes, wall-clock driven unless an adapter seeks it */
      @keyframes c09slide { from { transform: translateX(0px); } to { transform: translateX(360px); } }
      #c09dot { position: absolute; left: 40px; top: 170px; width: 60px; height: 60px;
                border-radius: 50%; background: #ffd166;
                 }

      /* c06: CSS motion path */
      #c06dot { position: absolute; left: 0; top: 0; width: 48px; height: 48px;
                border-radius: 50%; background: #ffd166;
                offset-path: path("M 60 300 C 160 60, 320 60, 420 300");
                offset-rotate: 0deg; offset-distance: 0%; }
    </style>
  </head>
  <body>
    <script>window.__hfTimelinesBuilding = true;</script>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4"
         data-width="1920" data-height="1080">

      <!-- row 0 -->
      <div class="cell" style="left:0px;   top:0px"><span class="lab">01 attr (control)</span>
        <svg viewBox="0 0 480 360"><circle id="c01" class="solid" cx="60" cy="200" r="40"/></svg></div>

      <div class="cell" style="left:480px; top:0px"><span class="lab">02 dashoffset</span>
        <svg viewBox="0 0 480 360"><path id="c02" class="ink" d="M 40 300 C 160 40, 320 40, 440 300"/></svg></div>

      <div class="cell" style="left:960px; top:0px"><span class="lab">03 DrawSVGPlugin</span>
        <svg viewBox="0 0 480 360"><path id="c03" class="ink" d="M 40 300 C 160 40, 320 40, 440 300"/></svg></div>

      <div class="cell" style="left:1440px;top:0px"><span class="lab">04 MorphSVGPlugin</span>
        <svg viewBox="0 0 480 360">
          <path id="c04" class="solid" d="M 240 60 L 300 180 L 430 200 L 335 290 L 358 420 L 240 358 L 122 420 L 145 290 L 50 200 L 180 180 Z"/>
          <path id="c04b" style="display:none" d="M 240 100 A 100 100 0 1 1 239 100 Z"/>
        </svg></div>

      <!-- row 1 -->
      <div class="cell" style="left:0px;   top:360px"><span class="lab">05 MotionPathPlugin</span>
        <svg viewBox="0 0 480 360">
          <path id="c05path" d="M 60 300 C 160 60, 320 60, 420 300" fill="none" stroke="#2a3340" stroke-width="4"/>
          <circle id="c05" class="solid" cx="0" cy="0" r="26"/>
        </svg></div>

      <div class="cell" style="left:480px; top:360px"><span class="lab">06 CSS offset-path</span>
        <svg viewBox="0 0 480 360"><path d="M 60 300 C 160 60, 320 60, 420 300" fill="none" stroke="#2a3340" stroke-width="4"/></svg>
        <div id="c06dot"></div></div>

      <div class="cell" style="left:960px; top:360px"><span class="lab">07 clipPath attr</span>
        <svg viewBox="0 0 480 360">
          <clipPath id="c07clip"><rect id="c07" x="40" y="120" width="0" height="160"/></clipPath>
          <rect x="40" y="120" width="400" height="160" fill="#6ee7ff" clip-path="url(#c07clip)"/>
        </svg></div>

      <div class="cell" style="left:1440px;top:360px"><span class="lab">08 SMIL animate</span>
        <svg viewBox="0 0 480 360">
          <circle class="solid" cx="60" cy="200" r="40">
            
          </circle>
        </svg></div>

      <!-- row 2 -->
      <div class="cell" style="left:0px;   top:720px"><span class="lab">09 CSS @keyframes</span>
        <div id="c09dot"></div></div>

      <div class="cell" style="left:480px; top:720px"><span class="lab">10 custom plugin</span>
        <svg viewBox="0 0 480 360"><path id="c10" class="ink" d=""/></svg></div>

      <div class="cell" style="left:960px; top:720px"><span class="lab">11 onUpdate (control)</span>
        <svg viewBox="0 0 480 360"><path id="c11" class="ink" d=""/></svg></div>

      <div class="cell" style="left:1440px;top:720px"><span class="lab">12 canvas via plugin</span>
        <canvas id="c12" width="480" height="360" style="position:absolute;inset:0"></canvas></div>

      <script>
        (function () {
          gsap.registerPlugin(MorphSVGPlugin, MotionPathPlugin, DrawSVGPlugin);

          /* A wave whose amplitude is the only free parameter. Used by 10, 11, 12
             so the three differ ONLY in how the derived value reaches the DOM. */
          function wave(a) {
            var d = "M 20 180";
            for (var x = 20; x <= 460; x += 10) {
              d += " L " + x + " " + (180 - a * Math.sin((x - 20) / 70));
            }
            return d;
          }

          /* c10 — a custom GSAP plugin. Its render() is called by the TWEEN, not
             by an event, so the question is whether tween rendering under a
             suppressEvents seek still reaches it. */
          gsap.registerPlugin({
            name: "dsWave",
            init: function (target, value) {
              this.t = target; this.a = value.from; this.b = value.to;
              return true;
            },
            render: function (ratio, data) {
              data.t.setAttribute("d", wave(data.a + (data.b - data.a) * ratio));
            },
          });

          /* c12 — same idea, but the sink is a canvas 2D context. */
          var ctx12 = document.getElementById("c12").getContext("2d");
          function draw12(a) {
            ctx12.clearRect(0, 0, 480, 360);
            ctx12.strokeStyle = "#6ee7ff"; ctx12.lineWidth = 10;
            ctx12.beginPath();
            for (var x = 20; x <= 460; x += 4) {
              var y = 180 - a * Math.sin((x - 20) / 70);
              x === 20 ? ctx12.moveTo(x, y) : ctx12.lineTo(x, y);
            }
            ctx12.stroke();
          }
          gsap.registerPlugin({
            name: "dsCanvas",
            init: function (target, value) { this.a = value.from; this.b = value.to; return true; },
            render: function (ratio, data) { draw12(data.a + (data.b - data.a) * ratio); },
          });

          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 4 } });

          tl.fromTo("#c01", { attr: { cx: 60 } }, { attr: { cx: 420 } }, 0);
          tl.fromTo("#c02", { strokeDasharray: 561, strokeDashoffset: 561 }, { strokeDashoffset: 0 }, 0);
          tl.fromTo("#c03", { drawSVG: "0% 0%" }, { drawSVG: "0% 100%" }, 0);
          tl.fromTo("#c04", { morphSVG: "#c04" }, { morphSVG: "#c04b" }, 0);
          tl.fromTo("#c05", { motionPath: { path: "#c05path", start: 0, end: 0, align: "#c05path", alignOrigin: [0.5, 0.5] } },
                            { motionPath: { path: "#c05path", start: 0, end: 1, align: "#c05path", alignOrigin: [0.5, 0.5] } }, 0);
          tl.fromTo("#c06dot", { offsetDistance: "0%" }, { offsetDistance: "100%" }, 0);
          tl.fromTo("#c07", { attr: { width: 0 } }, { attr: { width: 400 } }, 0);
          /* 08 SMIL and 09 CSS keyframes are declared in markup; nothing here drives them. */
          tl.fromTo("#c10", { dsWave: { from: 0, to: 0 } }, { dsWave: { from: 0, to: 140 } }, 0);

          var proxy = { a: 0 };
          tl.fromTo(proxy, { a: 0 }, {
            a: 140,
            onUpdate: function () { document.getElementById("c11").setAttribute("d", wave(proxy.a)); },
          }, 0);

          tl.fromTo({}, { x: 0 }, { x: 1, dsCanvas: { from: 0, to: 140 } }, 0);

          window.__timelines["main"] = tl;
        })();
      </script>
      <script>
        window.__hfTimelinesBuilding = false;
        window.dispatchEvent(new Event("hf-timelines-built"));
      </script>
    </div>
  </body>
</html>
