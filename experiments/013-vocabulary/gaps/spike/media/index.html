<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>013 — embedded media under capture</title>
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      body { font-family: system-ui, sans-serif; color: #e8eaed; }
      #root { position: absolute; inset: 0; }
      .cell { position: absolute; width: 480px; height: 360px; overflow: hidden; }
      .cell video, .cell img { position: absolute; inset: 0; width: 480px; height: 360px; }
      .lab { position: absolute; left: 8px; bottom: 6px; font-size: 20px; color: #6ee7ff; z-index: 4; }
    </style>
  </head>
  <body>
    <script>window.__hfTimelinesBuilding = true;</script>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4"
         data-width="1920" data-height="1080">

      <div class="cell" style="left:0px;top:0px">
        <video id="v1" src="ramp.mp4" muted playsinline></video><span class="lab">V1 bare</span></div>

      <div class="cell" style="left:480px;top:0px">
        <video id="v2" src="ramp.mp4" muted playsinline autoplay></video><span class="lab">V2 autoplay</span></div>

      <div class="cell" style="left:960px;top:0px">
        <video id="v3" src="ramp.mp4" muted playsinline></video><span class="lab">V3 plugin currentTime</span></div>

      <div class="cell" style="left:1440px;top:0px">
        <img id="i1" src="still.png" alt="" /><span class="lab">I1 static img</span></div>

      <script>
        (function () {
          /* V3: the video's own clock as a pure function of the composition's.
             The write happens inside a tween's render, never a callback. */
          gsap.registerPlugin({
            name: "dsVideoTime",
            init: function (target, value) { this.el = target; this.a = value.from; this.b = value.to; return true; },
            render: function (ratio, data) {
              try { data.el.currentTime = data.a + (data.b - data.a) * ratio; } catch (e) {}
            },
          });
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true, defaults: { ease: "none", duration: 4 } });
          tl.fromTo("#v3", { dsVideoTime: { from: 0, to: 0 } }, { dsVideoTime: { from: 0, to: 3.967 } }, 0);
          window.__timelines["main"] = tl;
        })();
      </script>
      <script>
        window.__hfTimelinesBuilding = false;
        window.dispatchEvent(new Event("hf-timelines-built"));
      </script>
    </div>
  </body>
</html>
